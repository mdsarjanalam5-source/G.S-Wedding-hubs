
name: Build G.S Wedding Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f -iname "*.zip" \
            ! -name "source-code.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository mein ZIP file nahi mili."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/gs-project"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/gs-project"

          PROJECT_DIR=$(dirname "$(find "$RUNNER_TEMP/gs-project" \
            -type f -name settings.gradle \
            ! -path '*/.gradle/*' | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android Gradle project nahi mila."
            find "$RUNNER_TEMP/gs-project" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager nahi mila."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon \
            -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK build successful"
          ls -lh "$APK"

      - name: Upload APK Download
        uses: actions/upload-artifact@v4
        with:
          name: GS-Wedding-Hub-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: G.S Wedding Hub APK ${{ github.run_number }}
          prerelease: true
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
